<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>検索結果 - 乗換案内</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  
  <!-- Simple Dot Pattern Background -->
  <div class="min-h-screen flex flex-col items-center p-4 relative"
      style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px;">

        <main class="w-full max-w-4xl z-10 py-8">

            <!-- Back Link -->
            <div class="mb-6">
                <a href="/"
                    class="text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-2 text-sm font-bold opacity-70 hover:opacity-100">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    検索に戻る
                </a>
            </div>

            <!-- Main Panel -->
            <div
                class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200">

                <!-- Header -->
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold text-slate-800 mb-2" id="route-header">検索中...</h1>
                    <p class="text-slate-500 text-sm" id="route-subheader"></p>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="flex flex-col items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-rose-500 mb-4"></div>
                    <p class="text-slate-500">時刻表を検索しています...</p>
                </div>

                <!-- Error State -->
                <div id="error-state" class="hidden text-center py-12">
                    <div class="text-6xl mb-4">😢</div>
                    <h2 class="text-xl font-bold text-rose-500 mb-2">ルートが見つかりませんでした</h2>
                    <p class="text-slate-500 text-sm" id="error-message"></p>
                </div>

                <!-- Result State -->
                <div id="result-state" class="hidden">
                    
                    <!-- View Mode: List vs Detail -->
                    <!-- 1. Route List (Master View) -->
                    <div id="route-list-view" class="space-y-3">
                        <h2 class="text-slate-500 text-sm mb-4">経路候補を選択してください</h2>
                        <div id="route-list-container" class="space-y-3">
                            <!-- Dynamically populated route cards -->
                        </div>
                    </div>

                    <!-- 2. Route Detail (Detail View) -->
                    <div id="route-detail-view" class="hidden relative">
                        <button id="back-to-list" class="mb-4 text-slate-500 hover:text-rose-600 flex items-center gap-1 text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                            候補一覧に戻る
                        </button>
                        
                        <!-- Header Summary -->
                         <div class="bg-linear-to-r from-rose-50 to-pink-50 rounded-2xl p-5 mb-6 border border-rose-100">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">出発時刻</p>
                                    <p class="text-3xl font-bold text-slate-800" id="first-departure">--:--</p>
                                </div>
                                <div class="text-center">
                                    <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">到着時刻</p>
                                    <p class="text-xl font-bold text-rose-600" id="arrival-time">--:--</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-slate-500 text-xs uppercase tracking-wider mb-1">乗換</p>
                                    <p class="text-3xl font-bold text-slate-800" id="transfer-count">-回</p>
                                </div>
                            </div>
                        </div>

                        <!-- 2-Column Layout: Timeline (Left) + Info (Right) -->
                        <div class="flex flex-col lg:flex-row gap-6">
                            
                            <!-- Left Column: Timeline -->
                            <div class="flex-1 lg:w-1/2">
                                <h3 class="text-slate-700 font-bold mb-4 border-b border-slate-200 pb-2">経路詳細</h3>
                                <div class="space-y-0" id="route-timeline"></div>
                            </div>

                            <!-- Right Column: Supplementary Info -->
                            <div class="lg:w-80 shrink-0">
                                <h3 class="text-slate-700 font-bold mb-4 border-b border-slate-200 pb-2">路線情報</h3>
                                <div id="delay-warnings" class="space-y-3"></div>
                            </div>

                        </div>
                    </div>

                </div>

            </div>
        </main>

        <footer class="mt-8 text-slate-500 text-sm z-10">
            公共交通オープンデータチャレンジ2025 プロトタイプ
        </footer>

    </div>
    <script type="module" src="/src/pages/detail.js"></script>
</body>

</html>
