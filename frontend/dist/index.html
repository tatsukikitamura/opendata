<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ノー遅延乗り換え - 遅延リスクを避けるルート検索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/opendata/assets/main-JTLdEt7K.js"></script>
  <link rel="modulepreload" crossorigin href="/opendata/assets/api-D0nMKdtm.js">
  <link rel="stylesheet" crossorigin href="/opendata/assets/api-DBQ-8LBh.css">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Simple Dot Pattern Background -->
  <div class="min-h-screen flex flex-col items-center justify-center p-4 relative"
       style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px;">

    <main class="w-full max-w-md z-10">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold mb-3 border border-emerald-200">
          <span>🛡️</span>
          <span>遅延リスク可視化</span>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">
          ノー遅延乗り換え
        </h1>
        <p class="text-slate-500 text-sm">絶対に遅刻できないあなたのための乗換案内</p>
      </div>

      <!-- Main Card -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">

        <form id="search-form" class="space-y-5">

          <!-- From Station -->
          <div class="relative">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">出発駅</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <span class="text-slate-400">📍</span>
                </div>
                <input type="text" id="from-station" placeholder="例: 千葉" required
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-all font-medium">
            </div>
          </div>

          <!-- To Station -->
          <div class="relative">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">到着駅</label>
             <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <span class="text-slate-400">🏁</span>
                </div>
                <input type="text" id="to-station" placeholder="例: 高田馬場" required
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-all font-medium">
            </div>
          </div>

          <!-- Departure Time -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">出発時刻</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <span class="text-slate-400">🕒</span>
                </div>
                <input type="time" id="departure-time" required
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-all font-medium">
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-sm transition-all active:scale-[0.98] mt-2">
            🛡️ 安全なルートを検索
          </button>
        </form>

        <!-- Quick Time Buttons -->
        <div class="mt-6 pt-6 border-t border-slate-200">
          <p class="text-xs text-slate-500 mb-3">クイック設定</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-time="07:00"
              class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors border border-slate-200">
              7:00
            </button>
            <button type="button" data-time="08:00"
              class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors border border-slate-200">
              8:00
            </button>
            <button type="button" data-time="09:00"
              class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors border border-slate-200">
              9:00
            </button>
            <button type="button" data-time="12:00"
              class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors border border-slate-200">
              12:00
            </button>
            <button type="button" data-time="18:00"
              class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors border border-slate-200">
              18:00
            </button>
            <button type="button" id="btn-current-time"
              class="px-3 py-1.5 text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 rounded-lg transition-colors">
              現在時刻
            </button>
          </div>
        </div>

      </div>
    </main>

    <footer class="mt-12 text-slate-500 text-sm z-10 flex items-center gap-4">
      <span>公共交通オープンデータチャレンジ2025 プロトタイプ</span>
      <a href="/info.html" class="text-slate-400 hover:text-slate-600 transition-colors underline">About</a>
    </footer>

  </div>
</body>

</html>
